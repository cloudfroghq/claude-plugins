name: validate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Validate the marketplace
        run: claude plugin validate --strict .

      - name: Validate knowledge-remote
        run: claude plugin validate --strict plugins/knowledge-remote

      - name: Check entries
        run: bash scripts/check-entries.sh

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tgz

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --no-banner --exit-code 1
